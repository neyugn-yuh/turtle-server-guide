# Keeps the guide in step with the server's config.
#
# Every few hours (and on demand, and on every push to main) this job
#   1. reads the minion definitions and the island upgrades from the server over the Pterodactyl API (read only),
#   2. commits src/data/servers/*/minions.json and island-upgrades.json when something changed,
#   3. builds the site and deploys it to Cloudflare Pages.
#
# Repository secrets (Settings > Secrets and variables > Actions). A step is skipped when its secrets are missing,
# so the workflow stays green until you add them. See "Đồng bộ với config của server" in README.md.
#   PTERO_URL, PTERO_KEY, PTERO_SERVER, PTERO_PLUGIN_DIR (optional)   sync from the server
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID                       deploy
name: Sync config and deploy

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# one run at a time, so two runs never push or deploy over each other
concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_KEY: ${{ secrets.PTERO_KEY }}
      PTERO_SERVER: ${{ secrets.PTERO_SERVER }}
      PTERO_PLUGIN_DIR: ${{ secrets.PTERO_PLUGIN_DIR }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the minions from the server
        if: env.PTERO_KEY != '' && env.PTERO_URL != '' && env.PTERO_SERVER != ''
        run: node scripts/sync-minions.mjs --ptero

      - name: Read the island upgrades from the server
        if: env.PTERO_KEY != '' && env.PTERO_URL != '' && env.PTERO_SERVER != ''
        run: node scripts/sync-island-upgrades.mjs --ptero

      - name: Read the materials and their recipes from the server
        if: env.PTERO_KEY != '' && env.PTERO_URL != '' && env.PTERO_SERVER != ''
        run: node scripts/sync-materials.mjs --ptero

      - name: Commit the changed data
        run: |
          if [ -n "$(git status --porcelain src/data/servers)" ]; then
            git config user.name "guide-sync"
            git config user.email "guide-sync@users.noreply.github.com"
            git add src/data/servers
            git commit -m "Sync minions from the server config"
            git push
          else
            echo "No change in the server config"
          fi

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages deploy --branch main
